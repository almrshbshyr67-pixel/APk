<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة هندسة وتغليف تطبيقات الأندرويد للمتاجر</title>
    
    <meta name="theme-color" content="#0b0f19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" id="dynamicManifest">

    <style>
        :root {
            --bg: #0b0f19;
            --card: #131d31;
            --border: #223555;
            --primary: #2563eb;
            --success: #059669;
            --danger: #dc2626;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --nav-bg: #0f172a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 15px; padding-bottom: 90px; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; }
        
        .page-pane { display: none; }
        .page-pane.active { display: block; }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { color: #60a5fa; font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 11px; border-radius: 8px; border: 1px solid var(--border); background: #0b0f19; color: var(--text); font-size: 13px; }
        input:focus, textarea:focus { outline: 2px solid var(--primary); }

        .btn { display: block; width: 100%; padding: 13px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; text-align: center; font-size: 14px; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; margin-top: 10px; }
        .btn-danger { background: var(--danger); color: white; margin-top: 8px; }

        .logo-preview-box { width: 70px; height: 70px; border-radius: 10px; border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; margin-top: 6px; background: #05080f; }
        .logo-preview-box img { width: 100%; height: 100%; object-fit: cover; }

        .log-box { background: #05080f; border: 2px solid #1e3a8a; border-radius: 10px; padding: 12px; font-family: monospace; font-size: 12px; color: #38bdf8; height: 180px; overflow-y: auto; margin-top: 10px; white-space: pre-wrap; }
        .preview-frame { width: 100%; height: 400px; background: white; border-radius: 8px; border: 1px solid var(--border); }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; background: var(--nav-bg);
            border-top: 1px solid var(--border); display: flex; justify-content: space-around;
            padding: 8px 0; z-index: 1000; box-shadow: 0 -4px 15px rgba(0,0,0,0.6);
        }
        .nav-item {
            background: none; border: none; color: var(--text-muted); font-size: 10px;
            display: flex; flex-direction: column; align-items: center; cursor: pointer; flex: 1;
        }
        .nav-item span { font-size: 15px; margin-bottom: 2px; }
        .nav-item.active { color: #60a5fa; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">

    <!-- الصفحة الأولى: الهوية، الشعار، واسم الحزمة -->
    <div id="paneIdentity" class="page-pane active">
        <div class="card">
            <h2>🤖 1. هوية التطبيق، الشعار، ومعرّف الحزمة للمتاجر</h2>
            
            <div class="form-group">
                <label>اسم التطبيق الرسمي (الذي يظهر على شاشة الهاتف)</label>
                <input type="text" id="appName" placeholder="مثال: تطبيقي الذكي" oninput="saveInputs()">
            </div>

            <div class="form-group">
                <label>معرّف الحزمة البرمجية للمتاجر (Package Name)</label>
                <input type="text" id="appPackage" placeholder="com.store.appname" dir="ltr" style="text-align: left;" oninput="saveInputs()">
            </div>

            <div class="form-group">
                <label>شعار وأيقونة التطبيق (صورة من هاتفك)</label>
                <input type="file" id="appLogoInput" accept="image/*" onchange="loadAppLogo(event)">
                <div class="logo-preview-box">
                    <img id="logoPreview" src="" alt="شعار التطبيق">
                </div>
            </div>

            <div class="form-group">
                <label>مصدر الكود أو المشروع:</label>
                <select id="sourceType" onchange="toggleSourceType()">
                    <option value="code">لصق كود التطبيق المباشر (HTML/JS)</option>
                    <option value="url">تغليف رابط موقع إلكتروني</option>
                </select>
            </div>

            <div id="codeBox" class="form-group">
                <label>كود التطبيق:</label>
                <textarea id="appCode" rows="5" placeholder="اكتب أو الصق الكود هنا..." oninput="saveInputs()"></textarea>
            </div>

            <div id="urlBox" class="form-group" style="display:none;">
                <label>رابط الموقع:</label>
                <input type="text" id="targetUrl" placeholder="https://example.com" dir="ltr" style="text-align: left;" oninput="saveInputs()">
            </div>
        </div>
    </div>

    <!-- الصفحة الثانية: المعاينة الحية للشعار والاسم -->
    <div id="panePreview" class="page-pane">
        <div class="card">
            <h2>👁️ 2. المعاينة الحية للتطبيق بالهوية الجديدة</h2>
            <button class="btn btn-primary" onclick="updatePreview()" style="margin-bottom: 10px;">🔄 تحديث المعاينة</button>
            <iframe id="previewFrame" class="preview-frame"></iframe>
        </div>
    </div>

    <!-- الصفحة الثالثة: توليد حزمة أندرويد وهيكل المتاجر -->
    <div id="paneAndroidGen" class="page-pane">
        <div class="card">
            <h2>⚙️ 3. توليد بنية أندرويد وملفات المتاجر</h2>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px;">
                اضغط لإنشاء وتوليد ملفات إعدادات أندرويد (AndroidManifest + Manifest.json + هيكل الحزمة):
            </p>
            <button class="btn btn-success" onclick="generateAndroidPackageFiles()">📦 توليد وتنزيل ملفات هيكل أندرويد</button>
        </div>
    </div>

    <!-- الصفحة الرابعة: الرفع السحابي لـ جيت هوب -->
    <div id="paneGithub" class="page-pane">
        <div class="card">
            <h2>🚀 4. الرفع الفعلي إلى جيت هوب (GitHub API)</h2>
            <div class="form-group">
                <label>اسم المستخدم في جيت هوب (Username)</label>
                <input type="text" id="ghUser" placeholder="yourname" dir="ltr" style="text-align: left;" oninput="saveInputs()">
            </div>
            <div class="form-group">
                <label>مفتاح الـ API السري (Token)</label>
                <input type="password" id="ghToken" placeholder="ghp_xxx" dir="ltr" style="text-align: left;" oninput="saveInputs()">
            </div>
            <div class="form-group">
                <label>اسم المستودع (Repository Name)</label>
                <input type="text" id="ghRepo" placeholder="my-android-app" dir="ltr" style="text-align: left;" oninput="saveInputs()">
            </div>
            <button class="btn btn-primary" onclick="deployToGithub()">⚡ تنفيذ الرفع السحابي للمشروع</button>
            <div class="log-box" id="logConsole">[ جاهز للربط السحابي... ]</div>
        </div>
    </div>

    <!-- الصفحة الخامسة: الإعدادات -->
    <div id="paneSettings" class="page-pane">
        <div class="card">
            <h2>🛠️ 5. إعدادات النظام والذاكرة</h2>
            <button class="btn btn-danger" onclick="localStorage.clear(); location.reload();">مسح الذاكرة وإعادة الضبط</button>
        </div>
    </div>

</div>

<nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('paneIdentity', this)"><span>🤖</span>الهوية</button>
    <button class="nav-item" onclick="switchTab('panePreview', this)"><span>👁️</span>المعاينة</button>
    <button class="nav-item" onclick="switchTab('paneAndroidGen', this)"><span>⚙️</span>أندرويد</button>
    <button class="nav-item" onclick="switchTab('paneGithub', this)"><span>🚀</span>الرفع</button>
    <button class="nav-item" onclick="switchTab('paneSettings', this)"><span>🛠️</span>الإعدادات</button>
</nav>

<script>
    // 1. التنقل بين الصفحات
    function switchTab(paneId, btn) {
        document.querySelectorAll('.page-pane').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(paneId).classList.add('active');
        btn.classList.add('active');
        if(paneId === 'panePreview') updatePreview();
    }

    // 2. نوع المصدر
    function toggleSourceType() {
        const type = document.getElementById('sourceType').value;
        if(type === 'url') {
            document.getElementById('urlBox').style.display = 'block';
            document.getElementById('codeBox').style.display = 'none';
        } else {
            document.getElementById('urlBox').style.display = 'none';
            document.getElementById('codeBox').style.display = 'block';
        }
        saveInputs();
    }

    // 3. رفع وحفظ الشعار والأيقونة
    function loadAppLogo(event) {
        const file = event.target.files[0];
        if(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Img = e.target.result;
                document.getElementById('logoPreview').src = base64Img;
                localStorage.setItem('app_logo_b64', base64Img);
                alert("✅ تم حفظ شعار وأيقونة التطبيق بنجاح!");
            };
            reader.readAsDataURL(file);
        }
    }

    // 4. الحفظ التلقائي بالذاكرة المحلية
    function saveInputs() {
        localStorage.setItem('app_name', document.getElementById('appName').value);
        localStorage.setItem('app_package', document.getElementById('appPackage').value);
        localStorage.setItem('source_type', document.getElementById('sourceType').value);
        localStorage.setItem('app_code', document.getElementById('appCode').value);
        localStorage.setItem('target_url', document.getElementById('targetUrl').value);
        localStorage.setItem('gh_user', document.getElementById('ghUser').value);
        localStorage.setItem('gh_token', document.getElementById('ghToken').value);
        localStorage.setItem('gh_repo', document.getElementById('ghRepo').value);
    }

    // استعادة البيانات عند التحميل
    window.onload = function() {
        if(localStorage.getItem('app_name')) document.getElementById('appName').value = localStorage.getItem('app_name');
        if(localStorage.getItem('app_package')) document.getElementById('appPackage').value = localStorage.getItem('app_package');
        if(localStorage.getItem('source_type')) {
            document.getElementById('sourceType').value = localStorage.getItem('source_type');
            toggleSourceType();
        }
        if(localStorage.getItem('app_code')) document.getElementById('appCode').value = localStorage.getItem('app_code');
        if(localStorage.getItem('target_url')) document.getElementById('targetUrl').value = localStorage.getItem('target_url');
        if(localStorage.getItem('gh_user')) document.getElementById('ghUser').value = localStorage.getItem('gh_user');
        if(localStorage.getItem('gh_token')) document.getElementById('ghToken').value = localStorage.getItem('gh_token');
        if(localStorage.getItem('gh_repo')) document.getElementById('ghRepo').value = localStorage.getItem('gh_repo');
        if(localStorage.getItem('app_logo_b64')) {
            document.getElementById('logoPreview').src = localStorage.getItem('app_logo_b64');
        }
    }

    // 5. المعاينة الحية
    function updatePreview() {
        const type = document.getElementById('sourceType').value;
        const frame = document.getElementById('previewFrame');
        if(type === 'url') {
            const url = document.getElementById('targetUrl').value.trim();
            frame.srcdoc = url ? `<iframe src="${url}" style="width:100%;height:100%;border:none;"></iframe>` : "<h3>الرجاء إدخال الرابط في الصفحة الأولى.</h3>";
        } else {
            const code = document.getElementById('appCode').value.trim();
            frame.srcdoc = code || "<h3>الرجاء إدخال الكود في الصفحة الأولى.</h3>";
        }
    }

    // 6. توليد وتنزيل ملفات هيكل أندرويد ومستندات المتاجر
    function generateAndroidPackageFiles() {
        const appName = document.getElementById('appName').value || "App";
        const pkg = document.getElementById('appPackage').value || "com.store.app";

        // توليد ملف AndroidManifest.xml الهندسي
        const androidManifest = `<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    package="${pkg}">
    <application
        android:allowBackup="true"
        android:icon="@mipmap/ic_launcher"
        android:label="${appName}"
        android:roundIcon="@mipmap/ic_launcher_round"
        android:supportsRtl="true"
        android:theme="@style/Theme.AppCompat.NoActionBar">
        <activity
            android:name=".MainActivity"
            android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>`;

        // توليد ملف manifest.json الخاص بتطبيقات الويب المتقدمة وأندرويد
        const webManifest = JSON.stringify({
            name: appName,
            short_name: appName,
            start_url: "./index.html",
            display: "standalone",
            background_color: "#0b0f19",
            theme_color: "#2563eb",
            icons: [
                { src: "icon.png", sizes: "192x192 512x512", type: "image/png" }
            ]
        }, null, 2);

        // تنزيل الملفات تباعاً لهاتفك
        downloadFile(androidManifest, "AndroidManifest.xml", "text/xml");
        downloadFile(webManifest, "manifest.json", "application/json");
        alert("✅ تم توليد وتنزيل ملفات إعدادات أندرويد (AndroidManifest و Manifest.json) بنجاح لهاتفك!");
    }

    function downloadFile(content, filename, contentType) {
        const blob = new Blob([content], { type: contentType });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
    }

    // 7. الرفع الفعلي لجيت هوب
    function logMsg(msg) {
        const box = document.getElementById('logConsole');
        box.innerText += "\n> " + msg;
        box.scrollTop = box.scrollHeight;
    }

    async function deployToGithub() {
        const user = document.getElementById('ghUser').value.trim();
        const token = document.getElementById('ghToken').value.trim();
        const repo = document.getElementById('ghRepo').value.trim().toLowerCase().replace(/\s+/g, '-');
        const sourceType = document.getElementById('sourceType').value;
        const appName = document.getElementById('appName').value || "App";

        if(!user || !token || !repo) {
            alert("⚠️ يرجى إدخال بيانات جيت هوب كاملة.");
            return;
        }

        document.getElementById('logConsole').innerText = "[ بدء ربط ورفع حزمة أندرويد للسحابة... ]";

        try {
            logMsg("إنشاء المستودع السحابي...");
            const createRes = await fetch(`https://api.github.com/user/repos`, {
                method: 'POST',
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name: repo, auto_init: true, private: false })
            });

            if(createRes.status !== 201 && createRes.status !== 422) {
                throw new Error("فشل إنشاء المستودع.");
            }
            logMsg("✅ المستودع جاهز.");

            // تجهيز كود index.html
            let codeContent = "";
            if(sourceType === 'url') {
                const targetUrl = document.getElementById('targetUrl').value.trim();
                codeContent = `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta http-equiv="refresh" content="0; url=${targetUrl}"></head><body>جاري التحويل...</body></html>`;
            } else {
                codeContent = document.getElementById('appCode').value || `<h1>${appName}</h1>`;
            }

            // رفع index.html
            await uploadFileToRepo(user, repo, token, "index.html", codeContent, "Add index.html");
            logMsg("📤 تم رفع ملف الواجهة index.html");

            // رفع manifest.json مدعوم بالشعار
            const webManifest = JSON.stringify({
                name: appName,
                short_name: appName,
                start_url: "./index.html",
                display: "standalone",
                background_color: "#0b0f19",
                theme_color: "#2563eb"
            }, null, 2);
            await uploadFileToRepo(user, repo, token, "manifest.json", webManifest, "Add manifest.json");
            logMsg("📤 تم رفع ملف manifest.json");

            const liveUrl = `https://${user}.github.io/${repo}/`;
            logMsg(`🎉 تم الرفع بنجاح تام!\nرابط مشروعك المباشر جاهز الآن للتغليف للمتاجر:\n${liveUrl}`);
            alert("🎉 تم الرفع إلى جيت هوب بنجاح تام!");

        } catch (err) {
            logMsg("❌ خطأ: " + err.message);
        }
    }

    async function uploadFileToRepo(user, repo, token, path, content, message) {
        const encoded = btoa(unescape(encodeURIComponent(content)));
        await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${path}`, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ message: message, content: encoded })
        });
    }
</script>

</body>
</html>
